# ┌──────────────────────────────────────────────────────────────┐
# │  cloud-cgc octocode DB — PUB surface orchestrator.           │
# │                                                              │
# │  semantic → graphrag over the PUBLIC index repos only        │
# │  (index_repos − private_repos in cloud-u-containers'         │
# │  user-ai_cloud-cgc-pub-mcp/build.json), then asks cloud-infra│
# │  to restore the PUB surface (octocode_db volume +            │
# │  kg_store_pub) on oci-apps.                                  │
# │  (per repo: each repo's job runs both phases, #888)          │
# │                                                              │
# │  The PVT surface has its own orchestrator in the private     │
# │  repo diegonmarcos/cloud-u-containers_cgc-pvt, which calls   │
# │  the same reusable cgc-db-index.yml pinned by sha. Spec:     │
# │  a0_docs/eng-specs/cgc-public-private-split.md               │
# │                                                              │
# │  Schedule twice daily (4/16 UTC, build.json                  │
# │  runtime.octocode.update.schedule). Scheduled runs are inert │
# │  until repo variable CGC_SCHEDULE_ENABLED=true (the cutover  │
# │  switch); workflow_dispatch always runs.                     │
# └──────────────────────────────────────────────────────────────┘

name: "cgc-db (pub surface: two-phase octocode index → GHCR → oci-apps)"
# Every dispatch input is surfaced in the title (#418: a queued run has no jobs and the API
# does not return dispatch inputs; cgc-db-queue-no-eviction.test.sh derives the list).
run-name: >-
  ${{ github.event_name == 'workflow_dispatch'
      && format('cgc-db pub · dispatch · phase={0} repos={1} force={2} restore={3}',
                inputs.phase, inputs.repos || 'all', inputs.force, inputs.restore)
      || format('cgc-db pub · {0}', github.event_name) }}

on:
  workflow_dispatch:
    inputs:
      phase:
        description: "Which phase(s) to run."
        required: false
        default: both
        type: choice
        options:
          - both
          - semantic
          - graphrag
      repos:
        description: "Optional space/comma-separated subset of the PUBLIC index repos (default: all)."
        required: false
        default: ""
        type: string
      restore:
        description: "Ask cloud-infra to restore the pub surface afterwards (default true)."
        required: false
        default: true
        type: boolean
      force:
        description: "Reindex even when HEAD matches the phase manifest (indexer change)."
        required: false
        default: false
        type: boolean
  schedule:
    - cron: "0 4,16 * * *"

# Two runs of THIS orchestrator must not overlap: they write the same per-repo GHCR tags
# and chunk state. cancel-in-progress false so a running semantic→graphrag chain is never
# cancelled; queue: max so a dispatch is never evicted by the next cron (#418). The pvt
# orchestrator writes a DISJOINT set of images (the private repos'), so it needs no shared
# group; the only shared writer risk is the legacy cloud-infra pipeline, handled by the
# `guard` job below because concurrency groups do not span repositories.
concurrency:
  group: cgc-db
  cancel-in-progress: false
  queue: max

jobs:
  guard:
    name: "guard · schedule switch + legacy drain"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: write
    steps:
      - name: Scheduled runs only after cutover
        if: ${{ github.event_name == 'schedule' && vars.CGC_SCHEDULE_ENABLED != 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "::notice::CGC_SCHEDULE_ENABLED is not 'true' — the legacy cloud-infra cgc-db.yml still owns the schedule; cancelling this scheduled run"
          gh run cancel "${{ github.run_id }}" -R "${{ github.repository }}"
          sleep 300
          exit 1
      - name: Refuse to overlap the legacy cloud-infra pipeline
        # The legacy cloud-infra cgc-db.yml writes the same cgc-db-<repo>:latest tags and
        # chunk state. A run of it still queued or running when this one starts would race
        # this run's checkpoints (last publish wins, the other's windows are lost). Public
        # API, no token. 404 = the legacy workflow file is gone (post-cutover) = drained.
        run: |
          set -eu
          URL="https://api.github.com/repos/diegonmarcos/cloud-infra/actions/workflows/cgc-db.yml/runs?per_page=50"
          code=$(curl -s -o legacy.json -w '%{http_code}' "$URL")
          case "$code" in
            404) echo "[cgc-db] legacy cloud-infra cgc-db.yml no longer exists — drained"; exit 0 ;;
            200) : ;;
            *)   echo "::error::cannot read legacy run state (HTTP $code) — refusing rather than risking two writers on the same GHCR tags"; exit 1 ;;
          esac
          LIVE=$(jq -r '[.workflow_runs[] | select(.status != "completed") | .id] | join(" ")' legacy.json)
          if [ -n "$LIVE" ]; then
            echo "::error::legacy cloud-infra cgc-db.yml run(s) still live: $LIVE — they write the same cgc-db-<repo>:latest tags; this run waits for them to finish (re-dispatch afterwards)"
            exit 1
          fi
          echo "[cgc-db] no live legacy run — proceeding"

  # #418: a scheduled run that reaches the front while a NEWER scheduled run waits behind it
  # is redundant (same inputs, older HEADs): it cancels ITSELF. Dispatches never coalesce.
  coalesce:
    name: "coalesce · newer scheduled run queued?"
    needs: guard
    if: ${{ github.event_name == 'schedule' }}
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Cancel this scheduled run if a newer scheduled run waits behind it
        env:
          GH_TOKEN: ${{ github.token }}
          ME: ${{ github.run_id }}
          # cgc-db-queue-no-eviction.test.sh extracts and EXECUTES this filter.
          SUPERSEDED_BY: '[.workflow_runs[] | select(.event == "schedule" and .status != "completed" and .id > (env.ME | tonumber)) | .id] | max // empty'
        run: |
          NEWER=$(gh api "repos/${{ github.repository }}/actions/workflows/cgc-db.yml/runs?event=schedule&per_page=50" --jq "$SUPERSEDED_BY")
          [ -z "$NEWER" ] && { echo "no newer scheduled run queued — this run proceeds"; exit 0; }
          echo "::notice::superseded by queued scheduled run $NEWER (same inputs, newer HEADs) — cancelling $ME so the queue stays bounded"
          gh run cancel "$ME" -R "${{ github.repository }}"
          sleep 300
          echo "::error::cancel of run $ME did not take effect within 300s"
          exit 1

  # Both phases, PER REPO (#888): schedule and phase=both. Each repo's matrix job in
  # cgc-db-index.yml runs its semantic step and then, in the same job, its graphrag step,
  # so a repo's graphrag starts the moment its OWN semantic ends instead of waiting for
  # the slowest repo's (cloud-infra run 37929244331: cloud-u-containers waited 5h for
  # cloud-u-android). The graphrag step runs on !cancelled(), so a failed or timed-out
  # semantic step still lets it run, as the phase-wide gate below does.
  per-repo:
    name: "phase · semantic → graphrag (per repo)"
    # coalesce is SKIPPED on dispatch; !cancelled() keeps a skipped need from skipping this.
    needs: [guard, coalesce]
    if: ${{ !cancelled() && needs.guard.result == 'success' && (github.event_name != 'workflow_dispatch' || inputs.phase == 'both') }}
    uses: ./.github/workflows/cgc-db-index.yml
    with:
      phase: both
      surface: pub
      repos: ${{ github.event.inputs.repos || '' }}
      force: ${{ github.event.inputs.force || 'false' }}
    secrets:
      CGC_GHCR_PAT: ${{ secrets.CGC_GHCR_PAT }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}

  # Single-phase dispatches only (schedule and phase=both go through per-repo above).
  semantic:
    name: "phase · semantic"
    # coalesce is SKIPPED on dispatch; !cancelled() keeps a skipped need from skipping this.
    needs: [guard, coalesce]
    if: ${{ !cancelled() && needs.guard.result == 'success' && github.event_name == 'workflow_dispatch' && inputs.phase == 'semantic' }}
    uses: ./.github/workflows/cgc-db-index.yml
    with:
      phase: semantic
      surface: pub
      repos: ${{ github.event.inputs.repos || '' }}
      force: ${{ github.event.inputs.force || 'false' }}
    secrets:
      CGC_GHCR_PAT: ${{ secrets.CGC_GHCR_PAT }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}

  # graphrag accepts a semantic `failure` (one repo failing in a fail-fast:false matrix is
  # normal) and `cancelled` (a lost hosted-runner leg), not an operator stop: the run-level
  # !cancelled() still blocks that. !cancelled(), never always() (always() runs in a
  # cancelled run).
  graphrag:
    name: "phase · graphrag"
    needs: [guard, semantic]
    if: >-
      ${{
        !cancelled()
        && needs.guard.result == 'success'
        && github.event_name == 'workflow_dispatch' && inputs.phase == 'graphrag'
        && (needs.semantic.result == 'success' || needs.semantic.result == 'skipped' || needs.semantic.result == 'failure' || needs.semantic.result == 'cancelled')
      }}
    uses: ./.github/workflows/cgc-db-index.yml
    with:
      phase: graphrag
      surface: pub
      repos: ${{ github.event.inputs.repos || '' }}
      force: ${{ github.event.inputs.force || 'false' }}
    secrets:
      CGC_GHCR_PAT: ${{ secrets.CGC_GHCR_PAT }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}

  # Propagation onto oci-apps needs the WireGuard mesh and SSH. Both stay in cloud-infra:
  # the gha-runner WireGuard peer is ONE slot shared with every fleet deploy, serialised by
  # cloud-infra's ship-wg-runner concurrency group, and a group cannot span repositories.
  # So this job only DISPATCHES cloud-infra's cgc-db-restore.yml for the pub surface, pinned
  # to this run's commit. The token can do nothing but start that workflow (fine-grained,
  # cloud-infra only, Actions: read and write).
  restore:
    name: "restore · dispatch cloud-infra cgc-db-restore (pub)"
    needs: [guard, per-repo, semantic, graphrag]
    if: >-
      ${{
        !cancelled()
        && needs.guard.result == 'success'
        && github.event.inputs.restore != 'false'
        && (needs.per-repo.result != 'skipped' || needs.semantic.result != 'skipped' || needs.graphrag.result != 'skipped')
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Dispatch the pub-surface restore in cloud-infra
        env:
          GH_TOKEN: ${{ secrets.CLOUD_INFRA_DISPATCH_TOKEN }}
          SOURCE: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -eu
          [ -n "$GH_TOKEN" ] || { echo "::error::CLOUD_INFRA_DISPATCH_TOKEN is not set in this repo — the index published to GHCR but oci-apps was NOT refreshed. Set the secret, or run cloud-infra's cgc-db-restore.yml by hand with surfaces=pub cgc_ref=${{ github.sha }}"; exit 1; }
          gh workflow run cgc-db-restore.yml -R diegonmarcos/cloud-infra \
            -f surfaces=pub -f cgc_ref="${{ github.sha }}" -f source="$SOURCE"
          echo "[cgc-db] dispatched cloud-infra cgc-db-restore.yml surfaces=pub cgc_ref=${{ github.sha }} (source $SOURCE)"
