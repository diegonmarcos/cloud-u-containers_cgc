# ┌──────────────────────────────────────────────────────────────┐
# │  cloud-cgc octocode DB — REUSABLE index phase (workflow_call)│
# │                                                              │
# │  One matrix job per repo: restore cgc-db-base + the repo's   │
# │  own ghcr.io/diegonmarcos/cgc-db-<repo>:latest, run octocode │
# │  over bounded chunk windows (a0_docs/eng-specs/cgc-          │
# │  incremental-chunked.md), publish the checkpoint back to the │
# │  same tag. No propagation here: restore-all needs the mesh   │
# │  and lives in cloud-infra's cgc-db-restore.yml (see          │
# │  a0_docs/eng-specs/cgc-public-private-split.md).             │
# │                                                              │
# │  CALLERS (one per surface, never both from one repo):        │
# │    pub  ./.github/workflows/cgc-db.yml in THIS repo (public) │
# │    pvt  diegonmarcos/cloud-me_cgc (private),                 │
# │         uses: …/cgc-db-index.yml@<sha> with cgc_ref: <sha>   │
# │                                                              │
# │  A called workflow runs in the CALLER's context: its jobs,   │
# │  logs and secrets are the caller's. That is the whole        │
# │  public/private mechanism: private repos are indexed only    │
# │  by the private caller, so their logs are private.           │
# │                                                              │
# │  phase → USE_LLM (semantic=false, graphrag=true) and         │
# │  CGC_MANIFEST_PHASE (per-phase manifest + chunk state).      │
# │  phase=both: each repo's job runs semantic, then graphrag in │
# │  the SAME job, so a repo's graphrag never waits for the      │
# │  slowest repo's semantic (#888).                             │
# │                                                              │
# │  runner: where the heavy `index` job runs. ubuntu-latest     │
# │  unless the caller is the PRIVATE pvt caller, which may pass │
# │  its own self-hosted runner (oci-apps, #951): the pub        │
# │  surface is forced onto ubuntu-latest whatever it passes.    │
# └──────────────────────────────────────────────────────────────┘

name: "cgc-db-index (reusable octocode index phase)"

on:
  workflow_call:
    inputs:
      phase:
        description: "Index phase: semantic (structural, no LLM), graphrag (LLM relationship enrichment), or both — each repo's matrix job runs semantic and then, in the same job, graphrag (#888)."
        required: true
        type: string
      surface:
        description: "pub = public repos only (any caller). pvt = private repos only (private caller only)."
        required: true
        type: string
      repos:
        description: "Optional subset of the surface's repos. Empty = all of them. Can only narrow, never add."
        required: false
        default: ""
        type: string
      force:
        description: "Reindex even when HEAD matches the phase manifest (indexer change)."
        required: false
        default: "false"
        type: string
      cgc_ref:
        description: "Commit of diegonmarcos/cloud-u-containers_cgc whose scripts run. A cross-repo caller MUST pass the same 40-hex sha it pins in `uses:`. Empty = this repo's own run sha (only valid when the caller IS this repo)."
        required: false
        default: ""
        type: string
      runner:
        description: "runs-on label for the heavy per-repo `index` job. Honoured ONLY on surface=pvt from a private caller (its own repo-scoped self-hosted runner, e.g. `self-hosted`); the pub surface always runs on ubuntu-latest, and a public repo must never use a self-hosted runner. A non-hosted runner caps the matrix at one job at a time."
        required: false
        default: "ubuntu-latest"
        type: string
    secrets:
      CGC_GHCR_PAT:
        description: "pub: classic PAT (write:packages, read:packages, delete:packages) — the public packages are linked to their own source repos, so the caller's GITHUB_TOKEN cannot write them. pvt: OPTIONAL — without it the private caller's own GITHUB_TOKEN pushes (packages: write), creating the private packages linked to that private repo (#951)."
        required: false
      OPENROUTER_API_KEY:
        description: "OPTIONAL. Direct OpenRouter key for the graphrag phase. Without it graphrag uses build.json's keyless mesh relay (my-ai-api), which only a runner on the fleet's private mesh (the oci-apps self-hosted runner) can reach."
        required: false
      CLOUD_DATA_DEPLOY_KEY:
        description: "pvt only: read-only deploy key for diegonmarcos/cloud-data."
        required: false
      CLOUD_MY_AI_MEMORY_DEPLOY_KEY:
        description: "pvt only: read-only deploy key for diegonmarcos/cloud-data-my-ai-memory."
        required: false

env:
  CGC_REPO: diegonmarcos/cloud-u-containers_cgc
  # GHCR push credential. cloud-cgc-db-update.sh reads GHCR_TOKEN for the login that pushes
  # every per-repo package; a package is linked to its SOURCE repo (org.opencontainers.image.
  # source), so the caller's GITHUB_TOKEN cannot write it. Falls back to GITHUB_TOKEN, which
  # degrades to a push failure that names the missing secret.
  GHCR_TOKEN: ${{ secrets.CGC_GHCR_PAT || github.token }}
  CGC_GHCR_PAT: ${{ secrets.CGC_GHCR_PAT }}
  GH_TOKEN: ${{ secrets.CGC_GHCR_PAT || github.token }}
  GITHUB_TOKEN: ${{ github.token }}
  GITHUB_ACTOR: ${{ github.actor }}
  CGC_FORCE: ${{ inputs.force == 'true' && '1' || '0' }}
  CGC_SURFACE: ${{ inputs.surface }}
  # The runner the index job actually gets (pub is pinned to hosted, see `index`).
  CGC_RUNNER: ${{ inputs.surface == 'pvt' && inputs.runner || 'ubuntu-latest' }}

jobs:
  # ── Guard + resolve the repo matrix (data-driven from cloud-u-containers' build.json) ──
  repos:
    name: "cgc-db · ${{ inputs.phase }} · ${{ inputs.surface }} · resolve repo matrix"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      repos: ${{ steps.repos.outputs.repos }}
      ref: ${{ steps.ref.outputs.ref }}
    steps:
      - name: Resolve the cgc code ref
        id: ref
        env:
          IN_REF: ${{ inputs.cgc_ref }}
          CALLER: ${{ github.repository }}
          CALLER_SHA: ${{ github.sha }}
        run: |
          set -eu
          if [ -n "$IN_REF" ]; then
            printf '%s' "$IN_REF" | grep -Eq '^[0-9a-f]{40}$' || { echo "::error::cgc_ref '$IN_REF' is not a 40-hex commit sha — pin a sha, never a branch"; exit 1; }
            REF="$IN_REF"
          elif [ "$CALLER" = "$CGC_REPO" ]; then
            REF="$CALLER_SHA"
          else
            echo "::error::caller $CALLER must pass cgc_ref (the sha it pins in uses:)"; exit 1
          fi
          echo "ref=$REF" >> "$GITHUB_OUTPUT"
          echo "[cgc-db] cgc code: $CGC_REPO@$REF"
      - name: Surface guard (caller visibility)
        env:
          CALLER: ${{ github.repository }}
        run: |
          set -eu
          case "${{ inputs.phase }}" in semantic|graphrag|both) : ;; *) echo "::error::unknown phase '${{ inputs.phase }}' (expected semantic|graphrag|both)"; exit 1 ;; esac
          PRIV=$(gh api "repos/$CALLER" -q .private 2>/dev/null || echo unknown)
          echo "[cgc-db] caller $CALLER private=$PRIV surface=$CGC_SURFACE"
          case "$CGC_SURFACE" in
            pub) : ;;
            pvt) [ "$PRIV" = "true" ] || { echo "::error::surface=pvt indexes private repos and may only run from a PRIVATE repository (caller $CALLER private=$PRIV): its logs would be public"; exit 1; } ;;
            *)   echo "::error::unknown surface '$CGC_SURFACE' (expected pub|pvt)"; exit 1 ;;
          esac
          # A public repository must never use a self-hosted runner (any fork PR could run
          # code on it). The index job already ignores `runner` off the pvt surface; refuse
          # the request outright so a public caller passing one is told, not silently moved.
          RUNNER_IN='${{ inputs.runner }}'
          case "$RUNNER_IN" in
            ""|ubuntu-latest) : ;;
            *) [ "$CGC_SURFACE" = pvt ] && [ "$PRIV" = "true" ] || { echo "::error::runner '$RUNNER_IN' requested by $CALLER (surface=$CGC_SURFACE private=$PRIV): only the private pvt caller may use a non-hosted runner"; exit 1; } ;;
          esac
          echo "[cgc-db] index job runner: $CGC_RUNNER"
      - uses: actions/checkout@v4
        with:
          repository: diegonmarcos/cloud-u-containers
          path: a_solutions
      - name: Resolve the surface's repos → matrix JSON
        id: repos
        run: |
          set -eu
          BJ="a_solutions/user-ai_cloud-cgc-pub-mcp/build.json"
          [ -f "$BJ" ] || { echo "::error::$BJ not found"; exit 1; }
          ALL=$(jq -c '[.runtime.octocode.index_repos[]]' "$BJ")
          PRIV=$(jq -c '[.runtime.octocode.private_repos // [] | .[]]' "$BJ")
          case "$CGC_SURFACE" in
            pub) REPOS_JSON=$(jq -nc --argjson a "$ALL" --argjson p "$PRIV" '$a - $p') ;;
            pvt) REPOS_JSON=$(jq -nc --argjson a "$ALL" --argjson p "$PRIV" '$a - ($a - $p)') ;;
          esac
          FILTER='${{ inputs.repos }}'
          if [ -n "$FILTER" ]; then
            SEL=$(printf '%s' "$FILTER" | tr ' ,' '\n\n' | jq -Rc . | jq -sc 'map(select(length > 0))')
            UNKNOWN=$(jq -nc --argjson all "$REPOS_JSON" --argjson sel "$SEL" '$sel - $all')
            [ "$UNKNOWN" = "[]" ] || { echo "::error::repos input names repo(s) outside the $CGC_SURFACE surface: $(printf '%s' "$UNKNOWN" | jq -r 'join(" ")')"; exit 1; }
            REPOS_JSON=$(jq -nc --argjson all "$REPOS_JSON" --argjson sel "$SEL" '$all - ($all - $sel)')
          fi
          [ "$(printf '%s' "$REPOS_JSON" | jq length)" -gt 0 ] || { echo "::error::no repo to index on surface $CGC_SURFACE"; exit 1; }
          # pub: prove every repo is PUBLIC on GitHub right now, unauthenticated. build.json's
          # private_repos is a declaration; a repo flipped private without updating it would
          # otherwise be indexed into public logs and public packages. 404 = not public.
          if [ "$CGC_SURFACE" = pub ]; then
            for r in $(printf '%s' "$REPOS_JSON" | jq -r '.[]'); do
              remote=$(jq -r --arg r "$r" '.runtime.octocode.repo_map[$r] // empty' "$BJ")
              [ -n "$remote" ] || { echo "::error::$r has no repo_map entry"; exit 1; }
              code=$(curl -s -o /dev/null -w '%{http_code}' "https://api.github.com/repos/diegonmarcos/$remote")
              [ "$code" = 200 ] || { echo "::error::$r ($remote) is not publicly readable (HTTP $code) — refusing to index it on the PUBLIC surface"; exit 1; }
            done
          fi
          echo "repos=$REPOS_JSON" >> "$GITHUB_OUTPUT"
          echo "[cgc-db] ${{ inputs.phase }} · $CGC_SURFACE matrix: $(printf '%s' "$REPOS_JSON" | jq -r 'join(" ")')"

  # ── One job per repo. fail-fast: false — each repo publishes to its OWN GHCR image, so
  # one repo's failure or timeout is isolated to that repo's checkpoint.
  index:
    name: "cgc-db · ${{ inputs.phase }} · ${{ matrix.repo }}"
    needs: repos
    # pub: always hosted. pvt: the private caller's choice (its self-hosted oci-apps
    # runner, #951 — hosted minutes of a private repo come out of the account budget).
    runs-on: ${{ inputs.surface == 'pvt' && inputs.runner || 'ubuntu-latest' }}
    # Job ceiling 350 > every index step's bound (cgc-db-index-budget.test.sh pins
    # budget + 30 <= step and the graphrag deadline, cgc-db-index-step-timeout.test.sh pins
    # step < job): a STEP timeout concludes FAILURE, which the graphrag gates accept; a JOB
    # timeout concludes CANCELLED and would skip graphrag. 350, was 330: phase=both runs
    # graphrag in this same job after semantic (#888). Hosted runners cap a job at 360.
    timeout-minutes: 350
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      # One job at a time on a self-hosted runner: one registration runs one job anyway,
      # and the box (oci-apps) keeps serving the fleet while it indexes.
      max-parallel: ${{ (inputs.surface == 'pvt' && inputs.runner != '' && inputs.runner != 'ubuntu-latest') && 1 || 8 }}
      matrix:
        repo: ${{ fromJson(needs.repos.outputs.repos) }}
    steps:
      # JOB CLOCK. Both index steps count their budget from here (update.sh reads
      # CGC_START_TS), so semantic and graphrag share ONE job-wide budget and the graphrag
      # step's deadline can be computed against the job timeout.
      - name: Job clock
        run: echo "CGC_START_TS=$(date +%s)" >> "$GITHUB_ENV"
      # Self-hosted only: the runner is persistent and shares oci-apps' disk with the fleet.
      # Refuse early rather than fill the box (the image build needs a few GB), and clear
      # what a previous job may have left in the runner's home (deploy keys, registry login).
      - name: Self-hosted preflight (disk, leftovers)
        if: ${{ env.CGC_RUNNER != 'ubuntu-latest' }}
        env:
          CGC_MIN_FREE_GB: "10"
        run: |
          set -eu
          rm -f "$HOME"/.ssh/cgc_* 2>/dev/null || true
          docker logout ghcr.io >/dev/null 2>&1 || true
          FREE=$(df -Pk "$RUNNER_TEMP" | awk 'NR==2{print int($4/1048576)}')
          echo "[cgc-db] self-hosted runner $RUNNER_NAME: ${FREE}G free under $RUNNER_TEMP"
          [ "$FREE" -ge "$CGC_MIN_FREE_GB" ] || { echo "::error::only ${FREE}G free on the self-hosted runner's disk (need ${CGC_MIN_FREE_GB}G) — refusing to index onto a full box"; exit 1; }
      - uses: actions/checkout@v4
        with:
          repository: diegonmarcos/cloud-u-containers_cgc
          ref: ${{ needs.repos.outputs.ref }}
      - uses: actions/checkout@v4
        with:
          repository: diegonmarcos/cloud-u-containers
          path: a_solutions
      # pvt without CGC_GHCR_PAT pushes with this run's GITHUB_TOKEN (#951). An EXISTING
      # package the token cannot write would only fail at publish time, after hours of
      # indexing: ask the registry now. Same probes the publish gate uses.
      - name: GHCR access preflight (pvt, GITHUB_TOKEN push)
        if: ${{ inputs.surface == 'pvt' && env.CGC_GHCR_PAT == '' }}
        env:
          REPO: ${{ matrix.repo }}
        run: |
          set -eu
          PREFIX=$(jq -r '.per_repo_publish.image_prefix' a_solutions/user-ai_cloud-cgc-pub-mcp/build.json)
          PKG="${PREFIX##*/}${REPO}"
          CGC_PKG_SOURCE_ONLY=1 . 1_cicd/src/ops/cloud-cgc-db-package.sh
          set +e
          VIS=$(ghcr_anon_visibility "$PKG")
          echo "[cgc-db] $PKG: anonymous probe says $VIS"
          case "$VIS" in
            absent)  echo "[cgc-db] $PKG does not exist yet — this run's GITHUB_TOKEN creates it, private and linked to $GITHUB_REPOSITORY" ;;
            private) ghcr_token_can_push "$PKG" && echo "[cgc-db] $PKG: this run's GITHUB_TOKEN may push" || { ghcr_token_access_fix "$PKG"; exit 1; } ;;
            public)  echo "::error::$PKG is publicly pullable but would hold a private repo's index — fix it in the GitHub UI first"; exit 1 ;;
            *)       echo "::error::ghcr.io did not answer the anonymous probe for $PKG"; exit 1 ;;
          esac
      - name: Fresh per-repo octocode home
        # Must end in /octocode: update.sh exports XDG_DATA_HOME as this path's parent.
        run: |
          mkdir -p "$RUNNER_TEMP/octocode-home/octocode"
          echo "OCTOCODE_HOME=$RUNNER_TEMP/octocode-home/octocode" >> "$GITHUB_ENV"
      - name: "cgc-db incremental update — ${{ matrix.repo }} only (checkpoint push, no propagate)"
        if: ${{ inputs.phase != 'graphrag' }}
        timeout-minutes: 315
        env:
          # phase=both runs THIS step as semantic; graphrag follows in the next step.
          USE_LLM: "false"
          # Direct OpenRouter WHEN the caller passes a key: environment is authoritative over
          # build.json, and that keeps a hosted matrix off the mesh. Without a key the three
          # stay EMPTY, so update.sh falls back to build.json's mesh relay (my-ai-api, which
          # holds the provider key itself) — reachable from the oci-apps runner (#951).
          OPENROUTER_API_URL: ${{ secrets.OPENROUTER_API_KEY != '' && 'https://openrouter.ai/api/v1/chat/completions' || '' }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          LLM_HEALTH_URL: ${{ secrets.OPENROUTER_API_KEY != '' && 'https://openrouter.ai/api/v1/models' || '' }}
          CGC_MANIFEST_PHASE: semantic
          CGC_INDEX_REPOS: ${{ matrix.repo }}
          CGC_PACKAGE_MODE: per-repo
          CGC_SKIP_PROPAGATE: "1"
          # 285, was 240 (#888): the 75m reserve covered a "restore" and a "publish" that were
          # both the quadratic lance integrity scan (57m per call on cloud-u-android, now ~1s).
          # The real pull and package+push of a 1G home take ~1m each; 30m stays reserved.
          CGC_BUDGET_MIN: "285"
          # Deploy keys reach only the private caller (a public caller has none to pass).
          # update.sh's ensure_repos reads CGC_DEPLOY_KEY_<local_dir folded to _>.
          CGC_DEPLOY_KEY_cloud_data: ${{ secrets.CLOUD_DATA_DEPLOY_KEY }}
          CGC_DEPLOY_KEY_cloud_my_ai_memory: ${{ secrets.CLOUD_MY_AI_MEMORY_DEPLOY_KEY }}
          # Private caller (logs verified private above): full octocode output. Public
          # caller: private-repo output is redacted by update.sh regardless.
          CGC_LOG_REDACT: ${{ inputs.surface == 'pvt' && 'off' || '' }}
        run: sh 1_cicd/src/ops/cloud-cgc-db-update.sh
      # ── graphrag, in the SAME job as this repo's semantic step (#888) ──
      # Per-phase matrices made every repo's graphrag wait for the slowest repo's semantic
      # job (cloud-infra run 37929244331: cloud-u-containers' semantic ended 15:31, its
      # graphrag could not start before 20:22). Here it starts when its OWN semantic ends.
      # !cancelled() keeps the old gate's guarantee: a FAILED semantic step (a slow repo's
      # step timeout included) still lets graphrag run.
      - name: "Fresh octocode home for graphrag — ${{ matrix.repo }}"
        if: ${{ !cancelled() && inputs.phase == 'both' }}
        # graphrag pulls what semantic just published, as the separate graphrag job did.
        run: |
          rm -rf "$RUNNER_TEMP/octocode-home"
          mkdir -p "$RUNNER_TEMP/octocode-home/octocode"
      - name: "cgc-db graphrag update — ${{ matrix.repo }} only (checkpoint push, no propagate)"
        if: ${{ !cancelled() && (inputs.phase == 'graphrag' || inputs.phase == 'both') }}
        # Static backstop below the 350-min job. The real bound is the deadline in `run`,
        # counted from the job clock, since this step starts whenever semantic ended.
        timeout-minutes: 340
        env:
          USE_LLM: "true"
          # Same key-or-relay choice as the semantic step above.
          OPENROUTER_API_URL: ${{ secrets.OPENROUTER_API_KEY != '' && 'https://openrouter.ai/api/v1/chat/completions' || '' }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          LLM_HEALTH_URL: ${{ secrets.OPENROUTER_API_KEY != '' && 'https://openrouter.ai/api/v1/models' || '' }}
          CGC_MANIFEST_PHASE: graphrag
          CGC_INDEX_REPOS: ${{ matrix.repo }}
          CGC_PACKAGE_MODE: per-repo
          CGC_SKIP_PROPAGATE: "1"
          # Job-wide budget from the job clock: 285 alone, 300 after semantic (phase=both),
          # so a repo whose semantic step used its budget (cloud-u-android until it
          # converges) is deferred below the 20-min floor rather than squeezed; graphrag only
          # works on files semantic has embedded.
          CGC_BUDGET_MIN: ${{ inputs.phase == 'both' && '300' || '285' }}
          # Hard deadline, minutes after the job clock: budget + 30, below the 350-min job.
          CGC_STEP_DEADLINE_MIN: ${{ inputs.phase == 'both' && '330' || '315' }}
          CGC_DEPLOY_KEY_cloud_data: ${{ secrets.CLOUD_DATA_DEPLOY_KEY }}
          CGC_DEPLOY_KEY_cloud_my_ai_memory: ${{ secrets.CLOUD_MY_AI_MEMORY_DEPLOY_KEY }}
          CGC_LOG_REDACT: ${{ inputs.surface == 'pvt' && 'off' || '' }}
        run: |
          left=$(( CGC_START_TS + CGC_STEP_DEADLINE_MIN * 60 - $(date +%s) ))
          [ "$left" -gt 60 ] || left=60
          echo "[cgc-db] graphrag step deadline: ${left}s from now (${CGC_STEP_DEADLINE_MIN}m after the job clock)"
          timeout --kill-after=120 "$left" sh 1_cicd/src/ops/cloud-cgc-db-update.sh
      # Self-hosted only: leave nothing of this job in the persistent runner's home.
      - name: Self-hosted cleanup (deploy keys, registry login)
        if: ${{ always() && env.CGC_RUNNER != 'ubuntu-latest' }}
        run: |
          rm -f "$HOME"/.ssh/cgc_* 2>/dev/null || true
          docker logout ghcr.io >/dev/null 2>&1 || true
          docker image prune -f >/dev/null 2>&1 || true
